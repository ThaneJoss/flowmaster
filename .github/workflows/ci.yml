name: Vue and Worker checks
on:
  pull_request:
  push:
    branches: [main, rewrite/vue-worker-ui]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:worker
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
          WRANGLER_SEND_METRICS: "false"
      - name: Check deployment configuration
        run: pnpm run deploy:doctor
      - name: Install isolated browser test runner
        run: |
          npm install --prefix /tmp/flowmaster-browser --no-package-lock --ignore-scripts playwright@1.61.1
          node /tmp/flowmaster-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser smoke with mocked API
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/flowmaster-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          PLAYWRIGHT_MODULE=/tmp/flowmaster-browser/node_modules/playwright node tests/browser-smoke.mjs
          PLAYWRIGHT_MODULE=/tmp/flowmaster-browser/node_modules/playwright node tests/canvas-smoke.mjs
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: test-results/*-failure.png
          if-no-files-found: ignore
